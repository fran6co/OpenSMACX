[project]
name = "opensmacx-recovery"
version = "0.1.0"
description = "Project configuration for recovering the shipped SMACX image."
requires-python = ">=3.12"
# The application is not a Python package. The installed framework owns the
# source readers; this project's legacy i386 measurement also needs its extra.
dependencies = ["match-recovery[x86]"]

[dependency-groups]
# Test runners are not package runtime dependencies.
test = [
    "pytest==8.4.1",
]

[tool.uv]
package = false
# So a bare `uv sync` reproduces the environment every tool already runs on,
# without anyone having to remember a group name.
default-groups = ["test"]

[tool.uv.workspace]
members = ["packages/match-recovery"]

[tool.uv.sources]
match-recovery = { workspace = true }

[tool.pytest.ini_options]
# Project integration imports stay test-local, not an editable root package.
pythonpath = ["."]
