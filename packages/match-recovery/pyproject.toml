[project]
name = "match-recovery"
version = "0.1.0"
description = "Evidence-driven, structure-led matching decompilation workflows"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# i386 image surveying and historical disassembly/measurement need Capstone. Reading and writing
# source annotations and running the workflow require only the standard library.
x86 = ["capstone==5.0.6"]

[project.scripts]
recover = "match_recovery.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "match_recovery"
