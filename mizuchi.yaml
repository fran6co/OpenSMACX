# Mizuchi configuration for OpenSMACX (win32 x86, MSVC 6 under Wine).
#
# Prerequisites (all local, none committed):
#   .opensmacx/game/terranx_original.exe   the hash-pinned original image
#   ~/opt/vc6                              VC6 install (relocatable via VC6_ROOT)
#   wine + winepath
#   tools/emit_target_object.py run once   build/target-objects/*.obj
#
# Run from the repository root:  npx mizuchi run   (or mizuchi from a checkout)

global:
  target: win32
  language: cpp
  maxRetries: 25
  # Parallel agent sessions (each with its own cache file). Raise or lower
  # depending on quota headroom; the programmatic phase is off anyway here.
  concurrency: 10
  outputDir: ./mizuchi/output
  promptsDir: ./mizuchi/prompts
  # Symbol -> target object map produced by tools/emit_target_object.py. The
  # key is the symbol both objects carry, which for a function only ever named
  # by a disassembler is a computed C decoration (`_sub_5e3650@8`) rather than
  # the catalogued label - see tools/recovery_symbols.py. The integrator reads
  # this file to get from a symbol back to an address.
  symbolMapPath: build/target-objects/symbol-map.json
  # Source-definition -> symbol pairing produced by tools/emit_asm_dumps.py
  sourceMapPath: mizuchi/source-map.json
  # Assembly dumps produced by tools/emit_asm_dumps.py (for the Atlas index)
  nonMatchingAsmFolders:
    - mizuchi/asm/nonmatching
  # Dumps of already-recovered functions, keyed by plain C++ name, so the
  # indexer pairs the src/ definitions with their assembly.
  matchingAsmFolders:
    - mizuchi/asm/matchings
  # The matched-C scan resolves assembly through compiled objects this project
  # does not have, so keep every C/C++ tree out of it except src/ (whose
  # recovered functions get their assembly from matchingAsmFolders); functions
  # without assembly are skipped with a warning.
  excludeFromScan:
    - tests
    - tools
    - build
    - docs
    - cmake

  # Scaffolding-only translation unit: class shells, callee declarations,
  # fixed-address globals, VCall shims. The submitted function definition is
  # concatenated onto it.
  getContextScript: |
    .opensmacx/venv/bin/python tools/mizuchi_context.py "{{functionName}}"

  # VC6 under Wine, matching the flag sets tools/byte_match.py measured the
  # shipped image with. {{extraFlags}} carries the per-function variant from
  # settings.yaml (compilerFlags), e.g. /Oy- when the original kept a frame
  # pointer. /O2 implies /Oy (no frame pointer) otherwise.
  compilerScript: |
    VC6_ROOT="${VC6_ROOT:-$HOME/opt/vc6}"
    export WINEPREFIX="$VC6_ROOT/.wineprefix"
    export WINEDEBUG=-all
    export INCLUDE="Z:$(printf '%s' "$VC6_ROOT/INCLUDE" | sed 's|/|\\|g')"
    export LIB="Z:$(printf '%s' "$VC6_ROOT/LIB" | sed 's|/|\\|g')"
    wine "$VC6_ROOT/BIN/CL.EXE" /nologo /c /O2 /Gy /GR- /GX {{extraFlags}} \
      /Fo"$(winepath -w '{{objFilePath}}')" "$(winepath -w '{{cFilePath}}')"

plugins:
  objdiff:
    diffSettings: {}

  claude-runner:
    timeoutMs: 600000
    ttftTimeoutMs: 180000

    # Inline assembly is ALLOWED here. The image contains hand-written __asm
    # (see the carry-flag rule in the system prompt): those bodies cannot be
    # reached from C++ at any flag setting, so a hard rejection would make them
    # permanently unmatchable. The prompt discourages it instead, which is the
    # right shape for "usually wrong, occasionally the only answer".
    rejectInlineAsm: false

    # Model used for decompilation (default: claude-sonnet-4-6).
    # Subscription auth: Claude Code aliases (opus, sonnet, haiku) or an
    # exact ID from https://api.anthropic.com/v1/models.
    model: claude-opus-5
    softTimeout:
      softTimeoutMs: 420000
      prompt: 'You are running out of time. Submit your best C++ code now in a ```cpp block. Do not explain, do not use tools, just output the code.'

    kickoffMessage: 'Decompile the function described in the system prompt. Respond with only the C++ code in a ```cpp code block.'

    systemPrompt: |
      You are an automated matching-decompilation system for a Windows x86
      binary compiled with Microsoft Visual C++ 6.0. You convert assembly into
      C++ that recompiles to an identical instruction stream.

      **Operating Context**
      - This is a fully automated pipeline with no human review
      - Do not request clarifications, confirmations, or permissions
      - You can use the read-only tools to inspect the codebase, but you cannot write or modify files directly
      - The last C++ code you provided will be concatenated with the `{{contextFilePath}}` during compilation. No other import statements or includes are supported

      **The context file**
      - Read `{{contextFilePath}}` first. It declares opaque class shells, the
        callees, fixed-address globals and VCall shims. The VC6 dialect and
        source-form rules are below in this prompt, not in that file.
      - Define exactly the one function the task names, out-of-line
        (`Ret Class::method(args) { ... }`). Do not redeclare anything the
        context already declares.
      - Use the definition head the task gives you VERBATIM, including
        `extern "C"` where it appears. That keyword is what makes the compiler
        emit the symbol the target object carries; drop it and the two objects
        share no symbol at all, and you get "symbol not found" instead of a
        diff, however correct the body is.
      - C runtime callees are C symbols: declare any you add `extern "C"`.
      - Callee signatures must match the catalog's mangling exactly
        (signedness and pointer types are visible in the mangled name).

      **Output Requirements**
      - Provide complete, compilable C++ code in a fenced code block (```cpp)
      - The system extracts and compiles only the **last** ```cpp block in your response

      **Success Criteria**
      - The compiled output must produce an instruction stream identical to the target
      - Functional equivalence is insufficient; source FORM matters: ternary vs
        if, loop shape, counting direction and signedness all change the code
      - Prefer real C++ over inline assembly, strongly. `__asm` pastes the
        original instructions rather than deriving them, so a body written that
        way proves nothing about the source and cannot be maintained. Reach for
        C++ first, and keep reaching: most differences that look like they need
        assembly are source FORM, not instruction selection.
      - `__asm` is permitted only as a last resort, for a target idiom the
        compiler provably cannot emit — the carry-flag case below is the known
        example. If you use it, use it for the smallest possible span, leave the
        rest as ordinary C++, and say in your final message which instructions
        you had to write by hand and why C++ could not produce them.

      **VC6 dialect**
      - Must compile under BOTH cl 12.00.8168 and i686-w64-mingw32-g++ -std=c++11.
      - Avoid: auto, nullptr, constexpr, static_assert, enum class, range-for,
        lambdas, long long, <cstdint>, and declaring `int i` twice in one
        function (VC6 leaks for-scope). static_cast/reinterpret_cast are fine
        and are the right spelling.

      **Source-form rules** — each learned by an agent that lost attempts to it.
      They are here so you do not rediscover them:
      - A ternary is not an if. `x ? a : b` lowers to `jne` with the arms
        swapped; `if (x) {...}` gives `je`.
      - VC6 NEVER hoists a same-polarity guard's body out of line. To get two
        special cases branching FAR away, write them negated and NESTED —
        `if (a != X) { if (a != Y) { return D; } ...; }` — not as sequential
        guard clauses, which inline each body instead.
      - VC6 rejects `__thiscall` on a free function pointer (C4234). For an
        indirect virtual call use the generated VCall shim in the context file;
        for a thiscall function POINTER, take a member-function pointer of a
        dummy class instead of spelling the convention.
      - Loop form is visible: while / do-while / for lower differently, and so
        does counting up versus down.
      - If the original dedicates a callee-saved register to a constant across
        the whole body (an extra `push ebx`/`push edi` in the prologue), it had
        enough register pressure to do so. That is a hard case.
      - Carry-flag accumulation (`shr X,1` followed by `adc acc,0`, or `sbb`)
        appears to be unreachable from C++ with this compiler. Measured over
        ~340 compilations: 13 spellings of a bit-count loop (do-while, while,
        for, shift-in-condition, extract-to-temp-before-shifting, `%2`,
        `if (v&1) c++`, and variants) crossed with 6 optimisation levels
        (/O1 /O2 /Ox /Og /Ot /Os), 4 processor targets (default /G5 /G6 /GB),
        /Oi on and off, and both frame-pointer settings. Every one emits
        `and`/`add`/`shr` or `test`/`je`/`inc`. None emits `adc` or `sbb`.
        A target body built from this idiom was most likely hand-written
        assembly in the original source, which is why no C++ reproduces it.
        Do NOT spend attempts hunting a spelling. Get the rest of the body as
        close as you can in ordinary C++; this is the one case where a small
        `__asm` block for the carry sequence is the right answer rather than a
        shortcut. Say which instructions you wrote by hand.

      **Available Tools**
      - `compile_and_view_assembly`: Compiles your C++ code, shows the resulting assembly, AND shows the diff against the target. The tool returns:
        - The compiled assembly
        - The number of instruction differences vs the target
        - The specific mismatched instructions with their types (INSERTION, DELETION, REPLACEMENT, OPCODE_MISMATCH, ARGUMENT_MISMATCH)

      **How to use the diff data**
      - If the difference count is 0, submit your code. Otherwise examine the listed mismatches and fix them before submitting.
      - A mismatch on a `call` symbol name means your declaration of that callee does not match the original's mangling: fix the signature or linkage, not the call site.
      - Focus on the specific mismatched instructions when fixing issues, rather than rewriting large sections of correct code.
      - Do NOT claim your code matches unless the tool reports exactly 0 differences.

      **Workflow**
      1. Read the context file at `{{contextFilePath}}`
      2. Analyze the provided assembly
      3. Produce equivalent C++ code
      4. Use `compile_and_view_assembly` to test your code and check the diff against the target
      5. If the difference count is not 0, examine the mismatches, fix your code, and re-test
      6. Once the difference count is 0, provide your final C++ code in a ```cpp block

      <decompilation_task>
      {{promptContent}}
      </decompilation_task>

      # Additional Guidelines

      - Test after each significant change
      - If stuck, try different approaches (different variable types, control structures, loop forms)

  m2c:
    enable: false

  decomp-permuter:
    enable: false

  # Post-match gate: re-verify the match against the pinned executable with
  # tools/byte_match.py and ratchet docs/recovery/byte-match.csv. Only a
  # BYTE_EXACT verdict is integrated (see mizuchi-integrator.mjs).
  integrator:
    enable: true
    integratorModule: ./mizuchi-integrator.mjs
    autoAction: commit
    commitMessageTemplate: 'recovery: byte-exact {{functionName}} via Mizuchi'
    branchTemplate: 'mizuchi/{{functionName}}'
